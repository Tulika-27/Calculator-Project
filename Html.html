<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator by Tulika</title>
</head>
<body>
    <div class="Calculator">
        <input type="text" placeholder="0">
    </div>
    <div>
        <button>AC</button>
        <button>DEL</button>
        <button>(</button>
        <button>)</button>
    </div>
    <div>
        <button>9</button>
        <button>8</button>
        <button>7</button>
        <button>%</button>
    </div>
    <div>
        <button>6</button>
        <button>5</button>
        <button>4</button>
        <button>+</button>
    </div>
    <div>
        <button>3</button>
        <button>2</button>
        <button>1</button>
        <button>-</button>
    </div>
    <div>
        <button>/</button>
        <button>0</button>
        <button>.</button>
        <button>*</button>
        <button>=</button>
    </div>
    
</body>
</html>
